<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TestAir{% endblock %}</title>
<style>
  :root { --teal:#0f766e; --teal-dark:#134e4a; --coral:#f97362; --sand:#fdf6ec; --ink:#1f2937; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Trebuchet MS", Verdana, sans-serif; background: var(--sand); color: var(--ink); }
  .demo-banner { background:#fde68a; color:#78350f; text-align:center; font-size:13px; padding:6px; }
  header.ta { background: var(--teal-dark); color:#fff; padding: 14px 24px; display:flex; align-items:center; gap:12px; }
  header.ta .logo { font-weight:bold; font-size:22px; letter-spacing:1px; }
  header.ta .logo span { color: var(--coral); }
  header.ta nav a { color:#d1fae5; margin-left:18px; text-decoration:none; font-size:14px; }
  main { max-width: 860px; margin: 28px auto; padding: 0 16px; }
  .card { background:#fff; border-radius:14px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input[type=text] { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px; }
  button { background: var(--coral); color:#fff; border:0; border-radius:999px; padding:10px 22px; font-size:15px; margin-top:16px; cursor:pointer; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color:#b91c1c; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:30px; }
</style>
</head>
<body>
<div class="demo-banner">TestAir is a fictional airline built for software testing. No real flights, bookings or payments.</div>
<header class="ta">
  <div class="logo">Test<span>Air</span></div>
  <nav><a href="/">Home</a><a href="/manage">Manage booking</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>&copy; TestAir (fictional) &middot; test environment</footer>
</body>
</html>
