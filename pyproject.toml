[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-agent"
version = "0.1.0"
description = "Answers airline policy questions for a specific booking using live-fetched policy pages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "anthropic>=0.70",
    "google-genai>=1.0",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
markers = [
    "live: hits real airline websites (own bookings only); skipped by default",
    "browser: needs Playwright chromium + the mock site; run with -m browser",
]
addopts = "-m 'not live and not browser'"
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]
